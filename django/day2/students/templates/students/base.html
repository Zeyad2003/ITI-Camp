<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{% block title %}Student Site{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; }
        nav { background: #333; color: white; padding: 10px; }
        nav a { color: white; margin-right: 15px; text-decoration: none; }
        footer { background: #f2f2f2; text-align: center; padding: 10px; margin-top: 20px; }
        .container { padding: 20px; min-height: calc(100vh - 100px); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ccc; padding: 8px; }
        footer { position: relative; bottom: 0; width: 100%; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'students:home' %}">Home</a>
        <a href="{% url 'students:students' %}">Students</a>
        <a href="{% url 'students:deleted' %}">Deleted</a>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <footer>
        &copy; 2025 Simple Student Site
    </footer>
</body>
</html>
