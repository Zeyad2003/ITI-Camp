{% extends 'students/base.html' %}
{% block title %}Student Details{% endblock %}
{% block content %}
<h1>{{ student.name }}</h1>
<ul>
  <li>Age: {{ student.age }}</li>
  <li>Email: {{ student.email }}</li>
  <li>Address: {{ student.address }}</li>
</ul>
<a href="{% url 'students:students' %}">Back to students</a>
{% endblock %}
